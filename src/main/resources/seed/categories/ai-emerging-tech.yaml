name: AI & Emerging Technologies
skills:
  - name: AI coding
    levels:
      basis: Gebruikt AI coding assistants (GitHub Copilot, Claude Code) voor basis code generatie
      redelijk: Past AI tools effectief toe voor refactoring en code review, begrijpt limitaties
      goed: Integreert AI in development workflow, gebruikt prompt engineering voor complexe taken
      uitstekend: Definieert AI-assisted development strategieën, mentort teams in effectief AI gebruik
